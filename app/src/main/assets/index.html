<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Global Trio</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e6eaf2;--inp:#f8fafc;--bad:#dc2626;--sec:#eef1f7;--tag:#fef3c7;--tagp:#d1fae5;--tagbad:#fee2e2;--warn:#b45309;
 --brand:#0f766e;--brand2:#14b8a6;--ac:#0f766e;--btn:#0f766e;--soft:rgba(15,118,110,.12);--ring:rgba(20,184,166,.28);--sh:0 1px 2px rgba(15,23,42,.05),0 10px 28px rgba(15,23,42,.07);--r:18px;color-scheme:light}
[data-theme=dark]{--bg:#0a1020;--card:#121a2e;--tx:#e8eefc;--mu:#93a4c3;--bd:#1f2b45;--inp:#0e1628;--bad:#f87171;--sec:#1b2640;--tag:#4a3b12;--tagp:#0f3a31;--tagbad:#4c1d1d;--warn:#fbbf24;
 --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:92px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.bt{display:flex;flex-direction:column;min-width:0}
.bt b{font-size:17px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bt small{opacity:.88;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr{display:flex;align-items:center;gap:8px;flex-shrink:0}.hr small{font-size:11px;background:rgba(255,255,255,.2);padding:4px 9px;border-radius:99px;max-width:116px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lk,#th{width:34px;height:34px;padding:0;margin:0;border-radius:99px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:none;border:0}
.logo{width:38px;height:38px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;flex-shrink:0;border:2px solid rgba(255,255,255,.55);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
main{padding:14px 14px 4px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.card>b:first-child{font-size:15px;font-weight:700}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:10px 0 4px}
input,select,button,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;background:var(--inp);color:var(--tx);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
button{background:linear-gradient(135deg,var(--btn),var(--brand2));color:#fff;border:0;font-weight:700;margin-top:10px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.16);transition:transform .08s}
button:active{transform:scale(.98)}
button.sec{background:var(--sec);color:var(--tx);box-shadow:none;border:1.5px solid var(--bd)}
button.sm{width:auto;padding:6px 12px;margin:0;font-size:12px;border-radius:99px;box-shadow:none}
.row{display:flex;gap:8px}.row>*{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -6px 24px rgba(15,23,42,.08);padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 2px;color:var(--mu);font-size:11px;font-weight:700;position:relative;text-decoration:none}
nav a .i{display:flex;padding:5px 16px;border-radius:99px;transition:background .18s,transform .18s}
nav a.on{color:var(--ac)}nav a.on .i{background:var(--soft);transform:translateY(-1px)}
nav a[data-badge="1"] .i::after{content:'';position:absolute;top:5px;left:calc(50% + 8px);width:9px;height:9px;border-radius:99px;background:var(--bad);border:2px solid var(--card)}
.ic{display:block}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd);flex-wrap:wrap}.item:last-child{border:0}
.who{display:flex;gap:10px;min-width:0;flex:1;align-items:flex-start}.who>div{min-width:0}
.av{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex-shrink:0}
.mu{color:var(--mu);font-size:12px}.ntxt{white-space:pre-wrap;word-break:break-word;margin:4px 0}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--tag);color:var(--tx);display:inline-block}.tag.p{background:var(--tagp)}.tag.bad{background:var(--tagbad)}.tag.warnt{background:var(--tag)}
.acts{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center}.acts input{flex:1;min-width:0}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:700}
.sc{overflow-x:auto}
.ico{width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:var(--ac);flex-shrink:0}
.hero{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 14px 30px rgba(0,0,0,.2);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:99px;background:rgba(255,255,255,.12)}
.hero small{opacity:.9}.hero .big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.kpi .kl{font-size:11px;color:var(--mu);font-weight:700;display:flex;gap:8px;align-items:center}.kpi .kv{font-size:20px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}.kpi .ks{font-size:11px;color:var(--mu)}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.qa button{margin:0;padding:12px 4px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:var(--sh)}
.qa .ico{width:38px;height:38px;border-radius:13px}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:0 0 8px;padding:12px;background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none;border-radius:14px;font-weight:600}
.rowbtn span:nth-child(2){flex:1}.rowbtn .chev{color:var(--mu)}
.sw{width:44px;height:44px;border-radius:14px;border:3px solid transparent;margin:0;padding:0;box-shadow:none}.sw.on{border-color:var(--tx)}
.sws{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0 16px}.dots span{width:8px;height:8px;border-radius:99px;background:var(--bd)}.dots span.on{background:var(--brand);width:24px}
.empty{text-align:center;color:var(--mu);padding:18px 8px}
#setup{position:fixed;inset:0;z-index:58;background:var(--bg);display:none;overflow:auto}.wz{max-width:480px;margin:0 auto;padding:22px 16px 40px}
#msg{position:fixed;top:64px;left:12px;right:12px;background:#111827;color:#fff;padding:11px 14px;border-radius:14px;display:none;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.35);font-weight:600}
#ask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;display:none;align-items:center;justify-content:center;padding:20px}
#lock{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}.lkb{width:100%;max-width:320px;text-align:center}.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kp button{margin:0;padding:16px;font-size:20px}
#upd{position:sticky;top:62px;z-index:19;padding:8px 12px 0}
.updbar{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 8px 20px rgba(0,0,0,.22)}.updbar .tx{flex:1;min-width:0}.updbar .tx b,.updbar .tx div{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.updbar .ico{background:rgba(255,255,255,.22);color:#fff}.updbar button{margin:0}.updbar button.sec{background:rgba(255,255,255,.2);color:#fff;border:0}.updbar b{font-size:14px}
textarea{resize:vertical;font-family:inherit}
input[type=file]{padding:8px;font-size:13px;color:var(--mu)}
input[type=file]::file-selector-button{border:0;background:linear-gradient(135deg,var(--btn),var(--brand2));color:#fff;border-radius:10px;padding:8px 14px;margin-right:10px;font:inherit;font-weight:700;cursor:pointer}

/* ---- Animations ---- */
@keyframes gtUp{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes gtFade{from{opacity:0}to{opacity:1}}
@keyframes gtPop{0%{opacity:0;transform:scale(.88) translateY(10px)}70%{transform:scale(1.02)}100%{opacity:1;transform:none}}
@keyframes gtDrop{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes gtSlideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes gtBounce{0%,100%{transform:translateY(-1px) scale(1)}40%{transform:translateY(-4px) scale(1.12)}}
@keyframes gtPulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.6)}70%{box-shadow:0 0 0 7px rgba(220,38,38,0)}100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}}
@keyframes gtShine{from{background-position:0% 50%}to{background-position:100% 50%}}
@keyframes gtFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
header{background-size:200% 200%;animation:gtShine 8s ease-in-out infinite alternate}
.logo{animation:gtFloat 4s ease-in-out infinite}
#v>.card,main>.card,.wz>.card{animation:gtUp .42s cubic-bezier(.2,.8,.2,1) both}
#v>.card:nth-child(2){animation-delay:.06s}#v>.card:nth-child(3){animation-delay:.12s}#v>.card:nth-child(4){animation-delay:.18s}#v>.card:nth-child(5){animation-delay:.24s}#v>.card:nth-child(n+6){animation-delay:.3s}
.item{animation:gtSlideIn .35s ease both}
.item:nth-child(2){animation-delay:.03s}.item:nth-child(3){animation-delay:.06s}.item:nth-child(4){animation-delay:.09s}.item:nth-child(5){animation-delay:.12s}.item:nth-child(n+6){animation-delay:.15s}
.card{transition:transform .2s ease,box-shadow .2s ease}.card:active{transform:scale(.995)}
button{transition:transform .12s ease,filter .15s ease,box-shadow .15s ease}button:active{transform:scale(.96);filter:brightness(.95)}
nav a.on .i{animation:gtBounce .4s ease}
nav a[data-badge="1"] .i::after{animation:gtPulse 1.8s infinite}
.tag{animation:gtFade .4s ease both}
#ask{animation:gtFade .2s ease}#ask>.card{animation:gtPop .35s cubic-bezier(.2,.9,.3,1.2) both}
#msg{animation:gtDrop .35s cubic-bezier(.2,.9,.3,1.2)}
#lock .lkb,#setup .wz{animation:gtPop .45s ease both}
.kp button:active{transform:scale(.9)}
.updbar{animation:gtDrop .4s ease both}
.av{animation:gtPop .4s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.phs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.phs img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:1.5px solid var(--bd);animation:gtPop .35s ease both;cursor:pointer}
.ph{position:relative}.ph b{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:99px;background:var(--bad);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.phin{display:none}#phv{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:95;display:flex;align-items:center;justify-content:center;padding:14px;animation:gtFade .2s ease}#phv img{max-width:100%;max-height:100%;border-radius:12px;animation:gtPop .3s ease}
#wn{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:56;display:flex;align-items:flex-end;justify-content:center;padding:12px;animation:gtFade .2s ease}
#wn>.card{width:100%;max-width:480px;max-height:80vh;overflow:auto;margin:0;animation:gtUp .35s cubic-bezier(.2,.8,.2,1) both}
#wn .wi{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}#wn .wi:last-of-type{border:0}#wn .wi span:first-child{font-size:18px}
</style></head><body>
<header><span class="brand"><span class="logo" id="logo">GT</span><span class="bt"><b id="bname">Global Trio</b><small id="btag"></small></span></span><span class="hr"><button id="lk" title="Lock the app" style="display:none"></button><button id="th" title="Light / dark"></button><small id="sync">not synced</small></span></header><div id="upd" style="display:none"></div>
<div id="setup"></div><div id="ask"></div><div id="lock"></div><div id="msg"></div><main id="v"></main>
<nav id="nav"></nav>
<script>
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const BASE_CATS={"Avroy Shlein Products":["Sprays","Roll-Ons","Perfumes"],"Inuka Products":["Sprays","Roll-Ons","Perfumes"],"Shipping":["N/A (Shipping)","Temu","Amazon","P-Plug","Ebay","Shein","Dischem","TakeAlot"]};
const K='gt_state_v1';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{products:[],sales:[],cats:[],exps:[],slog:[],alog:[],notes:[],prof:[],set:{url:'',key:'',year:new Date().getFullYear(),since:0}};
S.cats=S.cats||[];S.exps=S.exps||[];S.slog=S.slog||[];S.alog=S.alog||[];S.notes=S.notes||[];S.prof=S.prof||[];S.xl=S.xl||{};
const TN=['products','sales','cats','exps','slog','alog','notes','prof'],TBL=()=>TN.map(n=>S[n]);
S.set.firstRun=S.set.firstRun||Date.now();
const isDark=()=>{const t=S.set.theme||'auto';return t=='dark'||(t!='light'&&!!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))};
const ICONS={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/>',
 sales:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.8-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c3 .2 5 2.4 5 5.8"/>',
 box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
 notes:'<path d="M5 3h11l3 3v15H5z"/><path d="M8 9h8M8 13h8M8 17h5"/>',
 more:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
 moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 bell:'<path d="M6 17v-6a6 6 0 0 1 12 0v6l1.5 2h-15z"/><path d="M10 21h4"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
 wallet:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l12-3v3"/><circle cx="16.5" cy="13.5" r="1.2"/>',
 tag:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>',
 biz:'<path d="M3 21h18M5 21V8l7-4 7 4v13"/><path d="M9 21v-5h6v5M9 11h6"/>',
 chev:'<path d="M9 6l6 6-6 6"/>',
 down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',
 chat:'<path d="M4 5h16v11H9l-5 4z"/>'};
const ic=(n,sz)=>`<svg class="ic" width="${sz||22}" height="${sz||22}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;
const PALETTES={teal:['#0f766e','#14b8a6','#2dd4bf','Teal'],blue:['#1d4ed8','#3b82f6','#60a5fa','Blue'],purple:['#6d28d9','#8b5cf6','#a78bfa','Purple'],emerald:['#047857','#10b981','#34d399','Emerald'],orange:['#c2410c','#f97316','#fb923c','Orange'],rose:['#be123c','#f43f5e','#fb7185','Rose'],slate:['#334155','#64748b','#94a3b8','Slate']};
const BIZ_DEFAULT={name:'Global Trio',upd:'',tag:'',owner:'',phone:'',email:'',address:'',cur:'$',color:'teal',logo:'',footer:'Thank you for your business!',done:false,skipped:false};
function biz(){const r=(S.prof||[]).find(x=>x.id=='biz'&&!x.deleted);return Object.assign({},BIZ_DEFAULT,r||{})}
const bizName=()=>String(biz().name||'').trim()||'Global Trio';
const cur=()=>biz().cur||'$';
const initials=n=>String(n||'?').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const avHue=n=>{let h=7;for(const ch of String(n||''))h=(h*31+ch.charCodeAt(0))%360;return h};
const avatar=n=>`<span class="av" style="background:hsl(${avHue(n)},52%,${isDark()?'38%':'46%'})">${esc(initials(n))}</span>`;
function setBrandVars(color){const pal=PALETTES[color]||PALETTES.teal,d=isDark(),el=document.documentElement;
 if(el&&el.style&&el.style.setProperty){const n=parseInt(pal[0].slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255,set=(k,v)=>el.style.setProperty(k,v);
  set('--brand',pal[0]);set('--brand2',pal[1]);set('--btn',pal[0]);set('--ac',d?pal[2]:pal[0]);set('--soft','rgba('+r+','+g+','+b+','+(d?.24:.12)+')');set('--ring','rgba('+r+','+g+','+b+',.3)')}}
function applyBrand(){const b=biz();setBrandVars(b.color);
 const lg=document.querySelector('#logo');if(lg)lg.innerHTML=b.logo?`<img alt="" src="${esc(b.logo)}">`:esc(initials(bizName()).slice(0,2));
 const nm=document.querySelector('#bname');if(nm)nm.textContent=bizName();const tg=document.querySelector('#btag');if(tg)tg.textContent=b.tag||'';
 try{document.title=bizName()}catch(e){}closeSetupIfDone()}
function applyTheme(){const d=isDark(),el=document.documentElement;if(el&&el.setAttribute)el.setAttribute('data-theme',d?'dark':'light');const b=document.querySelector('#th');if(b)b.innerHTML=ic(d?'sun':'moon',18);applyBrand()}
const save=()=>{if(S.set.dev)TN.forEach(n=>(S[n]||[]).forEach(x=>{if(x.dirty&&!x.dev){x.dev=S.set.dev;x.by=x.by||myName()||undefined}}));try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(syncReady&&!busy&&dirtyCount()>0&&syncConfigured())queueSync()};
let syncReady=false,syncTimer=0,syncAgain=false,syncFails=0,retryTimer=0;
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const num=x=>parseFloat(x)||0,f2=x=>(Math.round(x*100)/100).toFixed(2);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const mOf=d=>MONTHS[parseInt(d.slice(5,7))-1],yOf=d=>parseInt(d.slice(0,4));
const toast=t=>{const m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(()=>m.style.display='none',2600)};

const ckey=n=>String(n||'').trim().toLowerCase().replace(/\s+/g,' ');
const payTotal=s=>(s.pays||[]).reduce((a,p)=>a+num(p.amt),0);
function saleMoney(s){const c=calc(s),rev=c.rev,rec=s.status=='Paid Up'?rev:Math.min(rev,payTotal(s));return{rev,received:rec,owed:Math.max(0,rev-rec),profit:c.profit}}
function normSale(s){if(s.pays&&s.pays.length){const full=payTotal(s)>=calc(s).rev-0.005;s.status=full?'Paid Up':'Credit';s.paidDate=full?(s.paidDate||today()):''}}
function addPayment(s,amt){amt=num(amt);if(amt<=0)return false;s.pays=s.pays||[];s.pays.push({id:uid(),date:today(),amt:Math.round(amt*100)/100});normSale(s);return true}
function markPaid(s){const left=saleMoney(s).owed;if(left>0){s.pays=s.pays||[];s.pays.push({id:uid(),date:today(),amt:left,auto:1})}s.status='Paid Up';s.paidDate=today()}
function backToCredit(s){if(s.pays&&s.pays.length)s.pays.pop();s.status='Credit';s.paidDate=''}

async function guardSale(ask,apply,doneText){
 const r=await askName('Who is making this change?',ask);if(r.busy)return false;
 if(!r.name){logChange('REVOKED - '+(r.timeout?'no name given within 60 seconds':'no name given')+'. Attempted: '+ask,{by:'(no name)',kind:'sale',revoked:true});
  toast('No name given - change revoked. Other managers have been alerted.');autoSync();return false}
 apply();logChange(doneText(r.name),{by:r.name,kind:'sale'});return true}

// ---- Customers, receipts, reminders ----

function customers(){const m=new Map();
 live(S.sales).forEach(s=>{const k=ckey(s.customer);if(!k)return;let c=m.get(k);
  if(!c){c={key:k,name:String(s.customer).trim(),phone:'',pd:'',sales:[],total:0,received:0,owed:0,last:''};m.set(k,c)}
  const mo=saleMoney(s);c.sales.push(s);c.total+=mo.rev;c.received+=mo.received;c.owed+=mo.owed;
  if(s.date>=c.last){c.last=s.date;c.name=String(s.customer).trim()}
  if(s.phone&&s.date>=c.pd){c.phone=s.phone;c.pd=s.date}});
 return m}
function waNumber(ph){const raw=String(ph||'').trim();let d=raw.replace(/[^0-9]/g,'');if(!d)return'';
 if(raw.startsWith('+'))return d;if(d.startsWith('00'))return d.slice(2);
 const cc=String(S.set.cc||'').replace(/\D/g,'');if(cc){if(d.startsWith('0'))d=d.slice(1);if(!d.startsWith(cc))d=cc+d}return d}
function sendText(phone,text){const n=waNumber(phone),url='https://wa.me/'+n+'?text='+encodeURIComponent(text);
 if(window.Native){if(n&&Native.openUrl)Native.openUrl(url);else if(Native.shareText)Native.shareText(text);else toast('Sharing works in the Android app only')}
 else if(window.open)window.open(n?url:'https://wa.me/?text='+encodeURIComponent(text))}
function callNumber(ph){const d=String(ph||'').replace(/[^0-9+]/g,'');if(!d)return toast('No phone number saved');if(window.Native&&Native.openUrl)Native.openUrl('tel:'+d)}
function receiptText(s){const m=saleMoney(s),b=biz();return bizName()+' - Receipt'+(b.tag?'\n'+b.tag:'')+(b.phone?'\nTel: '+b.phone:'')+(b.email?'\n'+b.email:'')+(b.address?'\n'+b.address:'')+'\nDate: '+s.date+'\nCustomer: '+s.customer+'\n'+s.product+' x '+s.qty+' @ '+cur()+f2(calc(s).sell)+' = '+cur()+f2(m.rev)+'\n'+(m.owed<0.005?'Status: PAID IN FULL':'Paid: '+cur()+f2(m.received)+'\nBalance owing: '+cur()+f2(m.owed))+'\n'+(b.footer||'Thank you!')}
function reminderText(c){return 'Hello '+c.name+', this is a friendly reminder from '+bizName()+': you have an outstanding balance of '+cur()+f2(c.owed)+'. Thank you!'}
function statementText(c){return bizName()+' - Statement for '+c.name+'\n'+c.sales.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>{const m=saleMoney(x);return x.date+'  '+x.product+' x'+x.qty+'  '+cur()+f2(m.rev)+(m.owed>0.004?'  (owes '+cur()+f2(m.owed)+')':'  paid')}).join('\n')+'\nTotal bought: '+cur()+f2(c.total)+'\nPaid: '+cur()+f2(c.received)+'\nBALANCE OWING: '+cur()+f2(c.owed)}
function payCustomer(key,amt){let left=num(amt),applied=0;const c=customers().get(key);if(!c)return{applied:0,extra:left};
 c.sales.filter(s=>s.status=='Credit').sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>{if(left<=0)return;const a=Math.min(saleMoney(s).owed,left);if(a>0.004&&addPayment(s,a)){s.updatedAt=Date.now();s.dirty=true;left-=a;applied+=a}});
 save();return{applied:Math.round(applied*100)/100,extra:Math.round(left*100)/100}}

function vCust(){

const sha256=(()=>{const K=[],H0=[];let n=2,c=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i==0)return false;return true};
 while(c<64){if(isP(n)){if(c<8)H0.push(Math.floor((Math.sqrt(n)%1)*4294967296));K.push(Math.floor((Math.cbrt(n)%1)*4294967296));c++}n++}
 const rr=(x,k)=>(x>>>k)|(x<<(32-k));
 return str=>{const bytes=new TextEncoder().encode(str),l=bytes.length,nb=((l+9+63)>>6)<<6,m=new Uint8Array(nb);m.set(bytes);m[l]=0x80;
  const dv=new DataView(m.buffer);dv.setUint32(nb-4,(l*8)>>>0);dv.setUint32(nb-8,Math.floor(l*8/4294967296));
  const h=H0.slice(),w=new Uint32Array(64);
  for(let o=0;o<nb;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
   for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
   let a=h[0],b=h[1],c2=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
   for(let i=0;i<64;i++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K[i]+w[i])>>>0,S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b)^(a&c2)^(b&c2),t2=(S0+mj)>>>0;hh=g;g=f;f=e;e=(d+t1)>>>0;d=c2;c2=b;b=a;a=(t1+t2)>>>0}
   h[0]=(h[0]+a)>>>0;h[1]=(h[1]+b)>>>0;h[2]=(h[2]+c2)>>>0;h[3]=(h[3]+d)>>>0;h[4]=(h[4]+e)>>>0;h[5]=(h[5]+f)>>>0;h[6]=(h[6]+g)>>>0;h[7]=(h[7]+hh)>>>0}
  return h.map(x=>x.toString(16).padStart(8,'0')).join('')}})();

function catRec(name,create){let r;
 if(name in BASE_CATS){r=S.cats.find(x=>x.id=='base:'+name);if(r&&r.deleted)r.deleted=false}else r=S.cats.find(x=>!x.deleted&&x.name==name);
 if(!r&&create){r={id:(name in BASE_CATS?'base:'+name:uid()),name,subs:[...(catMap()[name]||[])],updatedAt:Date.now(),dirty:true};S.cats.push(r)}
 return r}
function setSubs(name,subs){const r=catRec(name,true);r.subs=subs;r.deleted=false;r.updatedAt=Date.now();r.dirty=true;save()}
function touchAll(f,patch){let n=0;[S.products,S.sales,S.slog].forEach(t=>t.forEach(x=>{if(f(x)){patch(x);x.updatedAt=Date.now();x.dirty=true;n++}}));return n}
function addSub(name,sub){const g=needAuth();if(g)return g;sub=String(sub||'').trim();if(!sub)return'Enter a subcategory name';const cur=catMap()[name]||[];
 if(cur.some(x=>x.toLowerCase()==sub.toLowerCase()))return'That subcategory already exists';
 setSubs(name,[...cur,sub]);authOk();logChange('Added subcategory "'+sub+'" to '+name);return''}
function removeSub(name,sub){const g=needAuth();if(g)return g;const cur=catMap()[name]||[];if(cur.length<=1)return'A category needs at least one subcategory';const u=catUse(name,sub);
 if(u.p+u.s>0)return sub+' is used by '+u.p+' product record(s) and '+u.s+' sale(s). Rename it instead, or keep it.';
 setSubs(name,cur.filter(x=>x!==sub));authOk();logChange('Removed subcategory "'+sub+'" from '+name);return''}
function renameSub(name,old,nw){const g=needAuth();if(g)return g;nw=String(nw||'').trim();if(!nw)return'Enter a name';if(nw===old)return'';const cur=catMap()[name]||[];
 if(cur.some(x=>x.toLowerCase()==nw.toLowerCase()))return'That subcategory already exists';
 setSubs(name,cur.map(x=>x===old?nw:x));const n=touchAll(x=>x.category==name&&x.sub==old,x=>x.sub=nw);save();authOk();
 logChange('Renamed subcategory "'+old+'" to "'+nw+'" in '+name+' ('+n+' record'+(n==1?'':'s')+' updated)');return''}
function renameCat(old,nw){const g=needAuth();if(g)return g;nw=String(nw||'').trim();if(old in BASE_CATS)return'Built-in categories cannot be renamed';if(!nw)return'Enter a name';if(nw===old)return'';
 if(catMap()[nw])return'That category already exists';const r=catRec(old,false);if(!r)return'Category not found';
 r.name=nw;r.updatedAt=Date.now();r.dirty=true;const n=touchAll(x=>x.category==old,x=>x.category=nw);save();authOk();
 logChange('Renamed category "'+old+'" to "'+nw+'" ('+n+' record'+(n==1?'':'s')+' updated)');return''}
function addCat(name,subsText){const g=needAuth();if(g)return g;name=String(name||'').trim();if(!name)return'Enter a category name';if(catMap()[name])return'That category already exists';
 const seen=new Set(),subs=String(subsText||'').split(',').map(x=>x.trim()).filter(x=>{const k=x.toLowerCase();if(!x||seen.has(k))return false;seen.add(k);return true});
 const list=subs.length?subs:['General'];S.cats.push({id:uid(),name,subs:list,updatedAt:Date.now(),dirty:true});save();authOk();
 logChange('Added category "'+name+'" with subcategories: '+list.join(', '));return''}
function delCat(name){const g=needAuth();if(g)return g;if(name in BASE_CATS)return'Built-in categories cannot be deleted';const u=catUse(name);

 if(!fresh.length)return;fresh.forEach(l=>seen.push(l.id));if(seen.length>2000)seen.splice(0,seen.length-2000);save();
 const names=[...new Set(fresh.map(l=>l.by))].join(', '),rev=fresh.filter(l=>l.revoked),kinds=new Set(fresh.map(l=>l.kind||'category'));
 const noun=kinds.size==1?(kinds.has('sale')?'sales change':kinds.has('profile')?'business profile change':'category change'):'change';

 if(S.set.mgmtAlerts!==false&&window.Native&&Native.pushNotify)Native.pushNotify(rev.length?'Global Trio - change blocked':'Global Trio - '+noun,fresh.slice(-3).map(l=>(l.revoked?'⚠ ':'')+l.by+': '+l.text).join('\n'))}

 const type=NTYPES[o.type]?o.type:'note',raw=o.amt===''||o.amt==null?'':num(o.amt);if(raw!==''&&raw<0)return'Amount cannot be negative';

 if(o.id){const n=S.notes.find(x=>x.id==o.id&&!x.deleted);if(!n)return'Note not found';Object.assign(n,{date,type,amt,text});n.updatedAt=Date.now();n.dirty=true;save();return''}

const verNum=v=>parseInt(String(v||'').replace(/\D/g,''),10)||0;

const updPending=()=>!!(S.set.upd&&isNewer(S.set.upd));

function parseLatest(j){if(!j||typeof j!='object')return null;const v=String(j.version||''),t=String(j.tag||''),sha=String(j.sha256||'').toLowerCase(),size=+j.size;

 if(!repo){if(manual)toast('Set where updates are published first (More > Settings > App updates)');return false}
 try{const r=await nfetch('https://github.com/'+repo+'/releases/latest/download/latest.json?t='+Date.now(),{headers:{'Cache-Control':'no-cache'}});
  if(r.status==404){S.set.updChecked=Date.now();save();if(manual)toast('No update has been published yet');return false}
  if(!r.ok){if(manual)toast(r.status==0?'No internet connection':'Could not check for updates ('+r.status+')');return false}
  const u=parseLatest(await r.json());if(!u){if(manual)toast('The update information was not valid');return false}
  S.set.updChecked=Date.now();
  if(isNewer(u)){S.set.upd=u;const k=u.version+'-'+u.build;
   if(S.set.updSeen!==k){S.set.updSeen=k;toast('⬆ New version '+u.version+' is ready - tap Update');if(window.Native&&Native.pushNotify)Native.pushNotify('Global Trio update ready','Version '+u.version+' is available. Open the app to install it.')}}

async function shareExcel(){const h=SH(),tok=await shToken();
 if(!h.who)await shWho();
 if(h.who&&h.to&&!h.who.toLowerCase().includes(h.to.toLowerCase()))throw new Error('Signed in as '+h.who+', not '+h.to+'. Sign out and sign in with '+h.to);
 const hd={Authorization:'Bearer '+tok},item='https://graph.microsoft.com/v1.0/me/drive/root:'+encodeURI('/'+h.file)+':';
 if(!h.bk){ // keep the original workbook safe: copy it once before the first overwrite
  const g=await nfetch(item,{headers:hd});
  if(g.status==404){h.bk=true;save()} // no original exists, nothing to protect
  else if(!g.ok)throw await apiErr(g); // could not check -> do NOT overwrite
  else{const bn=h.file.replace(/\.xlsx$/i,'')+'_ORIGINAL_BACKUP.xlsx';
   const c=await nfetch(item+'/copy',{method:'POST',headers:{...hd,'Content-Type':'application/json'},body:JSON.stringify({name:bn})});
   if(!(c.status==202||c.ok))throw await apiErr(c);
   let ok=false;for(let i=0;i<20&&!ok;i++){await sleep(1500);ok=(await nfetch('https://graph.microsoft.com/v1.0/me/drive/root:'+encodeURI('/'+bn),{headers:hd})).ok}
   if(!ok)throw new Error('Could not confirm the backup copy of '+h.file+' - nothing was replaced');
   h.bk=true;save()}}
 const x=buildExport();
 const r=await nfetch(item+'/content',{method:'PUT',headers:{...hd,'Content-Type':x.mime,'X-GT-Base64':'1'},body:x.b64});
 if(!r.ok)throw await apiErr(r);
 h.last=new Date().toLocaleString();h.err='';save()}
async function shareFlow(){const h=SH();
 if(!(h.tok&&h.tok.refresh)){toast('OneDrive not linked yet - opening email instead');return emailExcel()}
 if(Date.now()>shArm){shArm=Date.now()+6000;toast('Tap again within 6 seconds to REPLACE '+h.file+' in '+h.to+' OneDrive');return}
 shArm=0;toast('Uploading…');
 try{await shareExcel();toast('Shared ✓ '+h.file+' updated in OneDrive')}catch(e){h.err=e.message;save();toast(e.message)}
 if(tab=='set')render()}
function mergeInto(loc,inc){inc.forEach(i=>{const c=loc.find(x=>x.id==i.id);if(!c)loc.push({...i,dirty:false});else if((i.updatedAt||0)>(c.updatedAt||0))Object.assign(c,i,{dirty:false})})}
const strip=a=>a.map(({dirty,...r})=>r);
async function cloudMeta(){ // tiny "has the shared file changed?" check, so polling does not download everything
 try{const c=CL(),h=await authH();
  if(c.type=='microsoft'){const r=await nfetch('https://graph.microsoft.com/v1.0/me/drive/root:/GlobalTrio/data.json?select=eTag',{headers:h});if(!r.ok)return null;const j=await r.json();return j.eTag||null}
  if(!c.fileId)return null;const r=await nfetch('https://www.googleapis.com/drive/v3/files/'+c.fileId+'?fields=version,modifiedTime',{headers:h});if(!r.ok)return null;const j=await r.json();return j.version?String(j.version):(j.modifiedTime||null)}
 catch(e){return null}}
async function cloudSync(manual){
 if(!(CL().tok&&CL().tok.refresh)){setSyncLabel('sign in needed');if(manual)toast('Sign in first (Settings > Sign in)');return}
 if(busy){syncAgain=true;return}busy=true;setSyncLabel('syncing…');let ok=false;
 try{const c=CL(),dirty0=dirtyCount()>0;
  const tag=await cloudMeta();   // the shared file's version BEFORE we download (safe: if it moves on, we just download again next time)
  if(tag&&!manual&&!dirty0&&tag===c.lastTag&&Date.now()-(c.lastFull||0)<600000){await excelPush()}   // nothing changed anywhere: skip the download
  else{
   const remote=await cloudGet(),had=!!remote,rm=remote||{};
   TN.forEach(n=>mergeInto(S[n],rm[n]||[]));applyBrand();checkAlerts();showChanges();
   Object.entries(rm.xl||{}).forEach(([k,v])=>{if(!S.xl[k]||(v.v||0)>(S.xl[k].v||0))S.xl[k]=v});
   const xlN=await excelPush();
   let put=false;
   if(dirtyCount()>0||!had||xlN>0){const sent=sentSnapshot(TBL()),o={xl:S.xl};TN.forEach(n=>o[n]=strip(S[n]));await cloudPut(o);markSent(sent);put=true}
   c.lastTag=put?await cloudMeta():tag;c.lastFull=Date.now();save()}
  ok=true;setSyncLabel(nowLabel());if(manual){toast(SH().xlErr?'Synced, but Excel: '+SH().xlErr:'Synced');render()}
 }catch(e){setSyncLabel(syncLabel(e));setErr(e.message);if(manual)toast('Sync failed: '+e.message)}
 afterSync(ok)}

let busy=false;
async function sync(manual){
 const ct=CL().type;if(ct=='google'||ct=='microsoft')return cloudSync(manual);
 if(ct!='server'||!S.set.url){if(manual)toast(ct=='none'?'Choose where to store your data in Settings':'Set server URL and key first');return}
 if(busy){syncAgain=true;return}busy=true;setSyncLabel('syncing…');let ok=false;
 try{const dp={};TN.forEach(n=>dp[n]=S[n].filter(x=>x.dirty));const sent=sentSnapshot(TBL());
  const r=await fetch(S.set.url+'/api/sync',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.set.key},body:JSON.stringify({...dp,since:S.set.since})});
  if(!r.ok)throw new Error(r.status==401?'Wrong API key':'Server error '+r.status);const d=await r.json();
  if(S.set.epoch&&d.epoch&&S.set.epoch!==d.epoch){TBL().forEach(a=>a.forEach(x=>x.dirty=true));S.set.since=0;S.set.epoch=d.epoch;save();busy=false;return sync(manual)} // server was reset: re-upload everything
  S.set.epoch=d.epoch;
  markSent(sent);
  const mg=(loc,inc)=>inc.forEach(i=>{const c=loc.find(x=>x.id==i.id);if(!c)loc.push(i);else if((i.updatedAt||0)>(c.updatedAt||0)&&!c.dirty)Object.assign(c,i)});
  TN.forEach(n=>mg(S[n],d[n]||[]));S.set.since=d.serverTime;applyBrand();checkAlerts();save();showChanges();
  ok=true;setSyncLabel(nowLabel());if(manual){toast('Synced');render()}
 }catch(e){setSyncLabel(syncLabel(e));if(manual)toast('Sync failed: '+e.message)}
 afterSync(ok)}
// ---- Automatic syncing: pushes every change within about a second, retries on failure, never loses a change made mid-sync ----
const dirtyCount=()=>TN.reduce((a,n)=>a+S[n].filter(x=>x.dirty).length,0);
function syncConfigured(){const c=CL();return(c.type=='google'||c.type=='microsoft')?!!(c.tok&&c.tok.refresh):(c.type=='server'&&!!S.set.url)}
const setSyncLabel=t=>{const l=document.querySelector('#sync');if(l)l.textContent=t};
const nowLabel=()=>'synced '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
function queueSync(ms){clearTimeout(syncTimer);syncTimer=setTimeout(()=>{sync(false);excelPush().catch(()=>{})},ms==null?600:ms)}
function autoSync(){if(syncConfigured())setSyncLabel('syncing…');else if(!(SH().xlOn&&SH().tok))setSyncLabel(CL().type=='none'?'saved on phone only':'sign in needed');queueSync()}
function flushNow(){if(dirtyCount()>0&&syncConfigured())sync(false)}
function afterSync(ok){busy=false;
 if(ok){syncFails=0;clearTimeout(retryTimer);if(dirtyCount()>0)queueSync(300)}   // something changed while we were syncing: send it right away
 else if(dirtyCount()>0){syncFails++;clearTimeout(retryTimer);retryTimer=setTimeout(()=>sync(false),Math.min(300000,10000*Math.pow(2,Math.min(syncFails-1,5))))}}   // offline etc: retry 10s, 20s, 40s ... max 5 min
const sentSnapshot=lists=>{const m=new Map();lists.forEach(a=>a.forEach(x=>{if(x.dirty)m.set(x,x.updatedAt)}));return m};
const markSent=m=>m.forEach((u,x)=>{if(x.updatedAt===u)x.dirty=false});
